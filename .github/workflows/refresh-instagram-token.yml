name: Refresh Instagram token

# Instagram long-lived tokens last 60 days. This renews it every week
# and saves the new one as the IG_TOKEN secret (needs the GH_PAT secret).
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Renew token and save it
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "IG_TOKEN or GH_PAT not set, skipping"; exit 0; fi
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
          echo "Instagram token renewed"
