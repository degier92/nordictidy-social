name: Post to Pinterest and Instagram

on:
  schedule:
    - cron: "7 * * * *"   # every hour; post.py only posts what is due
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be posted"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post due items
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python3 poster/post.py
      - name: Save the log
        if: always()
        run: |
          if [ -n "$(git status --porcelain log)" ]; then
            git config user.name "nordictidy-bot"
            git config user.email "nordictidy-bot@users.noreply.github.com"
            git add log
            git commit -m "Posted $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase
            git push
          fi
